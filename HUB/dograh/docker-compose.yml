name: dograh

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      dograh-internal:
        aliases:
          - dograh-postgres

  redis:
    image: redis:7
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      dograh-internal:
        aliases:
          - dograh-redis

  minio:
    image: ghcr.io/dograh-hq/minio:2026.09.22
    restart: unless-stopped
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_API_CORS_ALLOW_ORIGIN: https://dograh.phoenix-rtp.com
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      dograh-internal:
        aliases:
          - minio
      dokploy-network:
        ipv4_address: 10.0.1.41
        aliases:
          - dograh-minio
      xui-ipv6-egress:
        ipv4_address: 172.23.0.41
        ipv6_address: fd42:3a91:7c20:3::41

  minio-init:
    image: ghcr.io/dograh-hq/dograh-api:latest
    restart: "no"
    entrypoint: ["python", "/opt/minio-init.py"]
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: voice-audio
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
    volumes:
      - ./minio-init.py:/opt/minio-init.py:ro
      - ./config/minio-policy.json:/config/minio-policy.json:ro
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - dograh-internal

  api:
    image: ghcr.io/dograh-hq/dograh-api:latest
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO

      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-true}
      ENABLE_TELEMETRY: ${ENABLE_TELEMETRY:-false}

      PUBLIC_BASE_URL: https://dograh.phoenix-rtp.com
      PUBLIC_HOST: dograh.phoenix-rtp.com

      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@dograh-postgres:5432/postgres
      REDIS_URL: redis://:${REDIS_PASSWORD}@dograh-redis:6379

      ENABLE_AWS_S3: "true"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
      S3_BUCKET: voice-audio
      S3_REGION: us-east-1
      S3_ENDPOINT_URL: https://storage-dograh.phoenix-rtp.com
      S3_SIGNATURE_VERSION: s3v4
      S3_ADDRESSING_STYLE: path

      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: voice-audio
      MINIO_SECURE: "false"

      FASTAPI_WORKERS: "1"
      ENABLE_ARI_MANAGER: "true"
      ENABLE_CAMPAIGN_ORCHESTRATOR: "true"
      ENABLE_PROMETHEUS_METRICS: "false"
      ENABLE_COTURN: "false"
      FORCE_TURN_RELAY: "false"

      OSS_JWT_SECRET: ${OSS_JWT_SECRET:?OSS_JWT_SECRET is required}
      DOGRAH_DEVOPS_SECRET: ${DOGRAH_DEVOPS_SECRET:-}
      TELEPHONY_WS_TOKEN_SECRET: ${TELEPHONY_WS_TOKEN_SECRET:?TELEPHONY_WS_TOKEN_SECRET is required}
      TELEPHONY_WS_TOKEN_ENFORCE: "true"
      LANGFUSE_TRACES_PUBLIC: "false"

      HTTP_PROXY: http://172.23.0.10:8088
      HTTPS_PROXY: http://172.23.0.10:8088
      NO_PROXY: localhost,127.0.0.1,::1,postgres,redis,minio,api,dograh-api,dograh-postgres,dograh-redis,phoenix-rtp.com,192.168.10.0/24,192.168.11.0/24,10.100.0.0/16,172.19.0.0/16,172.23.0.0/16,172.30.0.0/16,10.0.1.0/24,fd42:3a91:7c20:2::/64,fd42:3a91:7c20:3::/64
      http_proxy: http://172.23.0.10:8088
      https_proxy: http://172.23.0.10:8088
      no_proxy: localhost,127.0.0.1,::1,postgres,redis,minio,api,dograh-api,dograh-postgres,dograh-redis,phoenix-rtp.com,192.168.10.0/24,192.168.11.0/24,10.100.0.0/16,172.19.0.0/16,172.23.0.0/16,172.30.0.0/16,10.0.1.0/24,fd42:3a91:7c20:2::/64,fd42:3a91:7c20:3::/64

    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      dograh-internal:
        aliases:
          - api
      dokploy-network:
        ipv4_address: 10.0.1.45
        aliases:
          - dograh-api
      xui-ipv6-egress:
        ipv4_address: 172.23.0.45
        ipv6_address: fd42:3a91:7c20:3::45

  ui:
    image: ghcr.io/dograh-hq/dograh-ui:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://dograh-api:8000
      NODE_ENV: oss
      NEXT_TELEMETRY_DISABLED: "1"
    networks:
      dokploy-network:
        ipv4_address: 10.0.1.40
        aliases:
          - dograh-ui
      xui-ipv6-egress:
        ipv4_address: 172.23.0.40
        ipv6_address: fd42:3a91:7c20:3::40

volumes:
  postgres_data:
    name: dograh_postgres_data
  redis_data:
    name: dograh_redis_data
  minio_data:
    name: dograh_minio_data

networks:
  default:
    external: true
    name: dokploy-network

  dokploy-network:
    external: true
    name: dokploy-network

  xui-ipv6-egress:
    external: true
    name: xui-ipv6-egress

  dograh-internal:
    name: dograh-internal
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/16
