services:
  3x-ui:
    image: ghcr.io/mhsanaei/3x-ui:latest
    pull_policy: always

    environment:
      XUI_DB_TYPE: "sqlite"
      XUI_DB_FOLDER: "/etc/x-ui"

      # Panel configuration
      XUI_PORT: "2095"
      XUI_INIT_WEB_BASE_PATH: "${XUI_INIT_WEB_BASE_PATH:?Set XUI_INIT_WEB_BASE_PATH in .env}"

      # TLS is terminated by Traefik
      XUI_SKIP_HSTS: "true"

      # Security and logging
      XUI_ENABLE_FAIL2BAN: "true"
      XUI_NONINTERACTIVE: "1"
      XUI_LOG_LEVEL: "warning"
      XUI_DEBUG: "false"

      XRAY_VMESS_AEAD_FORCED: "false"

    volumes:
      - /var/lib/3x-ui/db:/etc/x-ui
      - /etc/dokploy/traefik/dynamic/certificates:/root/cert:ro

    cap_add:
      - NET_ADMIN
      - NET_RAW

    devices:
      - /dev/net/tun:/dev/net/tun

    ports:
      # Subscription port
      - "8443:8443/tcp"
      # Xray inbound ports
      - "2053:2053/tcp"
      - "2053:2053/udp"
      - "7090:7090/udp"
      - "7080:7080/udp"
      - "7070:7070/udp"

    tty: true
    restart: unless-stopped

    networks:
      dokploy-network: {}
      xui-ipv6-egress:
        ipv4_address: 172.23.0.10
        ipv6_address: fd42:3a91:7c20:3::10

networks:
  default:
    name: dokploy-network
    external: true

  dokploy-network:
    name: dokploy-network
    external: true

  xui-ipv6-egress:
    name: xui-ipv6-egress
    driver: bridge
    enable_ipv6: true
    driver_opts:
      com.docker.network.bridge.name: br-xui6
    ipam:
      config:
        - subnet: 172.23.0.0/16
          gateway: 172.23.0.1
        - subnet: fd42:3a91:7c20:3::/64
          gateway: fd42:3a91:7c20:3::1