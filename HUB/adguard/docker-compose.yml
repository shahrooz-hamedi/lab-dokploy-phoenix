services:
  adguardhome:
    image: adguard/adguardhome:latest
    restart: unless-stopped

    ports:
      # DNS — bridge and public IPv4
      - "172.23.0.1:53:53/tcp"
      - "172.23.0.1:53:53/udp"
      - "193.151.155.226:53:53/tcp"
      - "193.151.155.226:53:53/udp"

      # DNS — bridge and public IPv6
      - "[fd42:3a91:7c20:3::1]:53:53/tcp"
      - "[fd42:3a91:7c20:3::1]:53:53/udp"
      - "[2a05:1a30:1:3::5d9]:53:53/tcp"
      - "[2a05:1a30:1:3::5d9]:53:53/udp"

      # DoT and DoQ — bridge and public IPv4
      - "172.23.0.1:853:853/tcp"
      - "172.23.0.1:853:853/udp"
      - "193.151.155.226:853:853/tcp"
      - "193.151.155.226:853:853/udp"

      # DoT and DoQ — bridge and public IPv6
      - "[fd42:3a91:7c20:3::1]:853:853/tcp"
      - "[fd42:3a91:7c20:3::1]:853:853/udp"
      - "[2a05:1a30:1:3::5d9]:853:853/tcp"
      - "[2a05:1a30:1:3::5d9]:853:853/udp"

    volumes:
      - adguardhome-work:/opt/adguardhome/work
      - adguardhome-conf:/opt/adguardhome/conf

      # Certificate and private key for DoT / DoQ.
      # Verify these files exist on the HUB host before deployment.
      - /etc/dokploy/traefik/dynamic/certificates/phoenix-rtp.com:/etc/adguard-certs:ro

    networks:
      dokploy-network:
        ipv4_address: 10.0.1.20

      xui-ipv6-egress:
        ipv4_address: 172.23.0.20
        ipv6_address: fd42:3a91:7c20:3::20

volumes:
  adguardhome-work:
    name: hub-adguardhome-work

  adguardhome-conf:
    name: hub-adguardhome-conf

networks:
  default:
    external: true
    name: dokploy-network

  dokploy-network:
    external: true

  xui-ipv6-egress:
    name: xui-ipv6-egress
    external: true
