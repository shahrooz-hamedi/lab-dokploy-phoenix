# Traefik dynamic configuration for AdGuard Home DNS-over-HTTPS.
# Exposes only the DoH endpoint, not the AdGuard dashboard.
http:
  routers:
    hub-adguard-doh:
      rule: "Host(`hub-dns.phoenix-rtp.com`) && PathPrefix(`/dns-query`)"
      entryPoints:
        - websecure
      service: hub-adguard-doh
      tls: {}
      priority: 100

  services:
    hub-adguard-doh:
      loadBalancer:
        serversTransport: hub-adguard-tls
        servers:
          - url: "https://10.0.1.20:443"

  serversTransports:
    hub-adguard-tls:
      serverName: hub-dns.phoenix-rtp.com
