name: hub-tunnel

services:
  tunnel:
    build:
      context: .
      dockerfile: Dockerfile

    image: hub-tunnel-ubuntu:24.04

    hostname: hub-tunnel
    restart: unless-stopped
    stop_grace_period: 30s
    init: false
    cgroup: host
    sysctls:
      net.ipv4.tcp_congestion_control: bbr
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
      net.ipv6.conf.default.forwarding: "1"
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - NET_RAW

    devices:
      - /dev/net/tun:/dev/net/tun

    security_opt:
      - apparmor:unconfined

    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # for C-Tunnel Only:
      - ctunnel-config:/etc/ctunnel
      - /etc/dokploy/traefik/dynamic/certificates/phoenix-rtp.com/fullchain.pem:/etc/ctunnel/certs/fullchain.pem:ro
      - /etc/dokploy/traefik/dynamic/certificates/phoenix-rtp.com/privkey.pem:/etc/ctunnel/certs/privkey.pem:ro

    tmpfs:
      - /run
      - /run/lock
      - /tmp

    ports:
      # C-Tunnel Tunnel Ports (LAB to HUB)
      - target: 2096
        published: "2096"
        protocol: tcp
        mode: host
      - target: 2096
        published: "2096"
        protocol: udp
        mode: host
      # C-Tunnel Tunnel Ports (PUB to HUB)
      - target: 2087
        published: "2087"
        protocol: tcp
        mode: host
      - target: 2087
        published: "2087"
        protocol: udp
        mode: host
      # C-Tunnel Tunnel Ports (Connection Test)
      - target: 7711
        published: "7711"
        protocol: tcp
        mode: host
      - target: 7712
        published: "7712"
        protocol: udp
        mode: host
      # SIP / UDP
      - target: 5060
        published: "5060"
        protocol: udp
        mode: host
      # SIP / TLS
      - target: 5061
        published: "5061"
        protocol: tcp
        mode: host
      # RTP / UDP 20x Ports
      - target: 10000
        published: "10000"
        protocol: udp
        mode: host
      - target: 10001
        published: "10001"
        protocol: udp
        mode: host
      - target: 10002
        published: "10002"
        protocol: udp
        mode: host
      - target: 10003
        published: "10003"
        protocol: udp
        mode: host
      - target: 10004
        published: "10004"
        protocol: udp
        mode: host
      - target: 10005
        published: "10005"
        protocol: udp
        mode: host
      - target: 10006
        published: "10006"
        protocol: udp
        mode: host
      - target: 10007
        published: "10007"
        protocol: udp
        mode: host
      - target: 10008
        published: "10008"
        protocol: udp
        mode: host
      - target: 10009
        published: "10009"
        protocol: udp
        mode: host
      - target: 10010
        published: "10010"
        protocol: udp
        mode: host
      - target: 10011
        published: "10011"
        protocol: udp
        mode: host
      - target: 10012
        published: "10012"
        protocol: udp
        mode: host
      - target: 10013
        published: "10013"
        protocol: udp
        mode: host
      - target: 10014
        published: "10014"
        protocol: udp
        mode: host
      - target: 10015
        published: "10015"
        protocol: udp
        mode: host
      - target: 10016
        published: "10016"
        protocol: udp
        mode: host
      - target: 10017
        published: "10017"
        protocol: udp
        mode: host
      - target: 10018
        published: "10018"
        protocol: udp
        mode: host
      - target: 10019
        published: "10019"
        protocol: udp
        mode: host

    networks:
      default: {}
      xui-ipv6-egress:
        ipv4_address: 172.23.0.100
        ipv6_address: fd42:3a91:7c20:3::100

    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          memory: 512M

volumes:
  # for C-Tunnel Only:
  ctunnel-config:

networks:
  default:
    name: xui-ipv6-egress
    external: true

  xui-ipv6-egress:
    external: true