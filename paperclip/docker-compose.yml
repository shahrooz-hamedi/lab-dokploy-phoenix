services:
  paperclip-postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - paperclip-postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - dokploy-network

  paperclip:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PAPERCLIP_IMAGE: ${PAPERCLIP_IMAGE}
        HERMES_VERSION: ${HERMES_VERSION}
        HERMES_COMMIT: ${HERMES_COMMIT}

    image: paperclip-phoenix:2026.916.1
    pull_policy: never
    restart: unless-stopped

    depends_on:
      paperclip-postgres:
        condition: service_healthy

    environment:
      # ---------------------------------------------------------------------
      # Runtime
      # ---------------------------------------------------------------------

      HOME: /home/node
      PATH: /home/node/.local/bin:/usr/local/bin:/usr/bin:/bin

      HOST: ${HOST}
      PORT: ${PORT}

      PAPERCLIP_HOME: ${PAPERCLIP_HOME}
      PAPERCLIP_INSTANCE_ID: ${PAPERCLIP_INSTANCE_ID}
      HERMES_HOME: ${HERMES_HOME}

      PAPERCLIP_BIND: ${PAPERCLIP_BIND}
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL}
      PAPERCLIP_API_URL: ${PAPERCLIP_API_URL}
      PAPERCLIP_CHAT_WEBHOOK_PUBLIC_URL: ${PAPERCLIP_CHAT_WEBHOOK_PUBLIC_URL}

      PAPERCLIP_AUTH_PUBLIC_BASE_URL: ${PAPERCLIP_AUTH_PUBLIC_BASE_URL}
      PAPERCLIP_AUTH_BASE_URL_MODE: ${PAPERCLIP_AUTH_BASE_URL_MODE}
      PAPERCLIP_ALLOWED_HOSTNAMES: ${PAPERCLIP_ALLOWED_HOSTNAMES}

      # ---------------------------------------------------------------------
      # PostgreSQL
      # ---------------------------------------------------------------------

      DATABASE_URL: postgresql://paperclip:${POSTGRES_PASSWORD}@paperclip-postgres:5432/${POSTGRES_DB}

      # ---------------------------------------------------------------------
      # UI / deployment
      # ---------------------------------------------------------------------

      SERVE_UI: ${SERVE_UI}
      PAPERCLIP_UI_DEV_MIDDLEWARE: ${PAPERCLIP_UI_DEV_MIDDLEWARE}

      PAPERCLIP_DEPLOYMENT_MODE: ${PAPERCLIP_DEPLOYMENT_MODE}
      PAPERCLIP_DEPLOYMENT_EXPOSURE: ${PAPERCLIP_DEPLOYMENT_EXPOSURE}

      PAPERCLIP_SECRETS_MASTER_KEY: ${PAPERCLIP_SECRETS_MASTER_KEY}
      PAPERCLIP_SECRETS_STRICT_MODE: ${PAPERCLIP_SECRETS_STRICT_MODE}

      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET}
      PAPERCLIP_AGENT_JWT_SECRET: ${PAPERCLIP_AGENT_JWT_SECRET}

      TRUST_PROXY: ${TRUST_PROXY}

      # ---------------------------------------------------------------------
      # Bifrost
      # ---------------------------------------------------------------------

      BIFROST_PAPERCLIP_API_KEY: ${BIFROST_PAPERCLIP_API_KEY}
      BIFROST_CEO_API_KEY: ${BIFROST_CEO_API_KEY}

      # Hermes and any direct Hermes-compatible calls use the CEO key.
      # Paperclip itself uses the Paperclip key.
      BIFROST_API_KEY: ${BIFROST_PAPERCLIP_API_KEY}

      BIFROST_OPENAI_BASE_URL: ${BIFROST_OPENAI_BASE_URL}
      BIFROST_ANTHROPIC_BASE_URL: ${BIFROST_ANTHROPIC_BASE_URL}

      # Canonical Bifrost model ID.
      BIFROST_MODEL_ID: ${BIFROST_MODEL_ID}

      # Paperclip-facing Anthropic-compatible path.
      ANTHROPIC_API_KEY: ${BIFROST_PAPERCLIP_API_KEY}
      ANTHROPIC_BASE_URL: ${BIFROST_ANTHROPIC_BASE_URL}

      # ---------------------------------------------------------------------
      # OpenCode
      #
      # OpenCode model references are provider/model.
      # Provider = bifrost
      # Model   = openrouter/bifrost/main-free
      # ---------------------------------------------------------------------

      PAPERCLIP_OPENCODE_PROVIDERS: >-
        {
          "bifrost": {
            "npm": "@ai-sdk/openai-compatible",
            "name": "Bifrost",
            "options": {
              "baseURL": "${BIFROST_OPENAI_BASE_URL}",
              "apiKey": "{env:BIFROST_PAPERCLIP_API_KEY}"
            },
            "models": {
              "openrouter/bifrost/main-free": {
                "contextWindow": 1000000,
                "maxTokens": 32768
              }
            }
          }
        }

      PAPERCLIP_OPENCODE_SMALL_MODEL: ${OPENCODE_MODEL_REF}

      # ---------------------------------------------------------------------
      # Pi
      #
      # Pi model IDs are the actual upstream model IDs served by Bifrost.
      # ---------------------------------------------------------------------

      PAPERCLIP_PI_PROVIDERS: >-
        {
          "bifrost": {
            "baseUrl": "${BIFROST_OPENAI_BASE_URL}",
            "apiKey": "{env:BIFROST_PAPERCLIP_API_KEY}",
            "api": "openai-completions",
            "models": [
              {
                "id": "openrouter/bifrost/main-free",
                "name": "Bifrost main-free",
                "reasoning": true,
                "input": ["text"],
                "cost": {
                  "input": 0,
                  "output": 0,
                  "cacheRead": 0,
                  "cacheWrite": 0
                },
                "contextWindow": 1000000,
                "maxTokens": 32768
              }
            ]
          }
        }

      # ---------------------------------------------------------------------
      # Codex
      #
      # Codex selects provider=bifrost and model from the Paperclip agent
      # configuration. The model value must remain the canonical Bifrost ID.
      # ---------------------------------------------------------------------

      PAPERCLIP_CODEX_PROVIDERS: >-
        {
          "providers": {
            "bifrost": {
              "name": "Bifrost",
              "base_url": "${BIFROST_OPENAI_BASE_URL}",
              "env_key": "BIFROST_PAPERCLIP_API_KEY",
              "wire_api": "responses"
            }
          },
          "model_provider": "bifrost"
        }

    volumes:
      - paperclip-data:/paperclip
      - paperclip-hermes:/home/node/.hermes

    networks:
      - dokploy-network

  hermes-dashboard:
    image: paperclip-phoenix:2026.916.1
    pull_policy: never
    restart: unless-stopped

    depends_on:
      paperclip:
        condition: service_started

    command:
      - hermes
      - dashboard
      - --host
      - 0.0.0.0
      - --port
      - "9119"
      - --no-open

    environment:
      HOME: /home/node
      HERMES_HOME: /home/node/.hermes
      PATH: /home/node/.local/bin:/usr/local/bin:/usr/bin:/bin

      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET}

      # The dashboard is CEO/Hermes-facing.
      BIFROST_API_KEY: ${BIFROST_CEO_API_KEY}

    volumes:
      - paperclip-hermes:/home/node/.hermes

    networks:
      - dokploy-network

networks:
  default:
    name: dokploy-network
    external: true

  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  paperclip-data:
  paperclip-postgres:
  paperclip-hermes: