services:
  paperclip-postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - paperclip-postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - dokploy-network

  paperclip:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PAPERCLIP_IMAGE: ${PAPERCLIP_IMAGE}

    image: paperclip-phoenix:2026.916.1
    pull_policy: never
    restart: unless-stopped

    depends_on:
      paperclip-postgres:
        condition: service_healthy

    environment:
      HOME: /home/node
      PATH: /home/node/.local/bin:/usr/local/bin:/usr/bin:/bin

      HOST: ${HOST}
      PORT: ${PORT}

      PAPERCLIP_HOME: ${PAPERCLIP_HOME}
      PAPERCLIP_INSTANCE_ID: ${PAPERCLIP_INSTANCE_ID}
      HERMES_HOME: ${HERMES_HOME}

      PAPERCLIP_BIND: ${PAPERCLIP_BIND}
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL}
      PAPERCLIP_API_URL: ${PAPERCLIP_API_URL}

      PAPERCLIP_AUTH_PUBLIC_BASE_URL: ${PAPERCLIP_AUTH_PUBLIC_BASE_URL}
      PAPERCLIP_AUTH_BASE_URL_MODE: ${PAPERCLIP_AUTH_BASE_URL_MODE}
      PAPERCLIP_ALLOWED_HOSTNAMES: ${PAPERCLIP_ALLOWED_HOSTNAMES}

      DATABASE_URL: ${DATABASE_URL}

      SERVE_UI: ${SERVE_UI}
      PAPERCLIP_UI_DEV_MIDDLEWARE: ${PAPERCLIP_UI_DEV_MIDDLEWARE}

      PAPERCLIP_DEPLOYMENT_MODE: ${PAPERCLIP_DEPLOYMENT_MODE}
      PAPERCLIP_DEPLOYMENT_EXPOSURE: ${PAPERCLIP_DEPLOYMENT_EXPOSURE}

      PAPERCLIP_SECRETS_MASTER_KEY: ${PAPERCLIP_SECRETS_MASTER_KEY}
      PAPERCLIP_SECRETS_STRICT_MODE: ${PAPERCLIP_SECRETS_STRICT_MODE}

      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET}
      PAPERCLIP_AGENT_JWT_SECRET: ${PAPERCLIP_AGENT_JWT_SECRET}

      TRUST_PROXY: ${TRUST_PROXY}

      # -----------------------------------------------------------------------
      # Bifrost
      # -----------------------------------------------------------------------
      #
      # BIFROST_SELECTED_MODEL is the Paperclip-facing model reference:
      #     bifrost/main-free
      #
      # The provider definitions below deliberately use the underlying model
      # id "main-free" because the provider itself is already named "bifrost".
      #
      BIFROST_OPENAI_BASE_URL: ${BIFROST_OPENAI_BASE_URL}
      BIFROST_ANTHROPIC_BASE_URL: ${BIFROST_ANTHROPIC_BASE_URL}
      BIFROST_API_KEY: ${BIFROST_PAPERCLIP_API_KEY}
      BIFROST_SELECTED_MODEL: ${BIFROST_SELECTED_MODEL}

      ANTHROPIC_API_KEY: ${BIFROST_PAPERCLIP_API_KEY}
      ANTHROPIC_BASE_URL: ${BIFROST_ANTHROPIC_BASE_URL}

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      XAI_API_KEY: ${XAI_API_KEY}
      HF_TOKEN: ${HF_TOKEN}
      ZAI_API_KEY: ${ZAI_API_KEY}
      KIMI_MODEL_API_KEY: ${KIMI_MODEL_API_KEY}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY}
      KILO_API_KEY: ${KILO_API_KEY}
      CURSOR_API_KEY: ${CURSOR_API_KEY}

      # -----------------------------------------------------------------------
      # OpenCode
      #
      # Agent model reference:
      #     bifrost/main-free
      #
      # Provider model registry:
      #     main-free
      # -----------------------------------------------------------------------
      PAPERCLIP_OPENCODE_PROVIDERS: >-
        {"bifrost":{"npm":"@ai-sdk/openai-compatible","name":"Bifrost","options":{"baseURL":"${BIFROST_OPENAI_BASE_URL}","apiKey":"{env:BIFROST_API_KEY}"},"models":{"main-free":{}}}}

      PAPERCLIP_OPENCODE_SMALL_MODEL: ${BIFROST_SELECTED_MODEL}

      # -----------------------------------------------------------------------
      # Pi
      #
      # Paperclip agent model:
      #     bifrost/main-free
      #
      # Pi provider registry:
      #     provider = bifrost
      #     model    = main-free
      # -----------------------------------------------------------------------
      PAPERCLIP_PI_PROVIDERS: >-
        {"bifrost":{"baseUrl":"${BIFROST_OPENAI_BASE_URL}","apiKey":"{env:BIFROST_API_KEY}","api":"openai-completions","models":[{"id":"main-free","name":"Bifrost main-free","reasoning":true,"input":["text"],"cost":{"input":0,"output":0,"cacheRead":0,"cacheWrite":0},"contextWindow":262144,"maxTokens":32768}]}}

      # -----------------------------------------------------------------------
      # Codex
      #
      # Codex separates provider from model:
      #     model_provider = bifrost
      #     model          = main-free
      # -----------------------------------------------------------------------
      PAPERCLIP_CODEX_PROVIDERS: >-
        {"providers":{"bifrost":{"name":"Bifrost","base_url":"${BIFROST_OPENAI_BASE_URL}","env_key":"BIFROST_API_KEY","wire_api":"responses"}},"model_provider":"bifrost"}

    volumes:
      - paperclip-data:/paperclip
      - paperclip-hermes:/home/node/.hermes

    networks:
      - dokploy-network

  hermes-dashboard:
    image: paperclip-phoenix:2026.916.1
    pull_policy: never
    restart: unless-stopped

    command:
      - hermes
      - dashboard
      - --host
      - 0.0.0.0
      - --port
      - "9119"
      - --no-open

    environment:
      HOME: /home/node
      HERMES_HOME: /home/node/.hermes
      PATH: /home/node/.local/bin:/usr/local/bin:/usr/bin:/bin

      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET}

      # CEO-only Bifrost credential.
      # Hermes config.yaml uses the named custom provider "bifrost".
      BIFROST_API_KEY: ${BIFROST_CEO_API_KEY}

    volumes:
      - paperclip-hermes:/home/node/.hermes

    networks:
      - dokploy-network

networks:
  default:
    name: dokploy-network
    external: true

  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  paperclip-data:
  paperclip-postgres:
  paperclip-hermes: