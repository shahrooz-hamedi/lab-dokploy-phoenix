services:
  paperclip-postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - paperclip-postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 2s
      timeout: 5s
      retries: 30

    networks:
      - dokploy-network

  paperclip:
    build:
      context: .
      dockerfile: Dockerfile

    image: paperclip-phoenix:2026.1001.0-hermes

    restart: unless-stopped

    depends_on:
      paperclip-postgres:
        condition: service_healthy

    environment:
      PORT: "3100"
      PAPERCLIP_BIND: lan

      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_INSTANCE_ID: default

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@paperclip-postgres:5432/${POSTGRES_DB}

      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: public
      PAPERCLIP_AUTH_BASE_URL_MODE: "explicit"

      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL}
      PAPERCLIP_API_URL: ${PAPERCLIP_API_URL}
      PAPERCLIP_AUTH_PUBLIC_BASE_URL: ${PAPERCLIP_AUTH_PUBLIC_BASE_URL}
      PAPERCLIP_ALLOWED_HOSTNAMES: ${PAPERCLIP_ALLOWED_HOSTNAMES}

      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET}
      PAPERCLIP_AGENT_JWT_SECRET: ${PAPERCLIP_AGENT_JWT_SECRET}

      PAPERCLIP_SECRETS_MASTER_KEY: ${PAPERCLIP_SECRETS_MASTER_KEY}
      PAPERCLIP_SECRETS_STRICT_MODE: "true"

      PAPERCLIP_TELEMETRY_DISABLED: "1"

      # ------------------------------------------------------------
      # Bifrost — Paperclip OpenAI-compatible API
      # ------------------------------------------------------------
      OPENAI_API_KEY: ${BIFROST_PAPERCLIP_API_KEY}
      OPENAI_BASE_URL: ${BIFROST_OPENAI_BASE_URL}

      # ------------------------------------------------------------
      # Bifrost — Paperclip Anthropic-compatible API
      # ------------------------------------------------------------
      ANTHROPIC_API_KEY: ${BIFROST_PAPERCLIP_API_KEY}
      ANTHROPIC_BASE_URL: ${BIFROST_ANTHROPIC_BASE_URL}

      # ------------------------------------------------------------
      # Bifrost — dedicated CEO Hermes credential
      # ------------------------------------------------------------
      BIFROST_CEO_API_KEY: ${BIFROST_CEO_API_KEY}

      # ------------------------------------------------------------
      # Codex local -> Bifrost
      # ------------------------------------------------------------
      PAPERCLIP_CODEX_PROVIDERS: >-
        {
          "providers": {
            "bifrost": {
              "name": "Bifrost",
              "base_url": "${BIFROST_OPENAI_BASE_URL}",
              "env_key": "OPENAI_API_KEY",
              "wire_api": "responses"
            }
          },
          "model_provider": "bifrost"
        }

      # ------------------------------------------------------------
      # Pi local -> Bifrost
      # ------------------------------------------------------------
      PAPERCLIP_PI_PROVIDERS: >-
        {
          "bifrost": {
            "baseUrl": "${BIFROST_OPENAI_BASE_URL}",
            "apiKey": "{env:OPENAI_API_KEY}",
            "api": "openai-completions",
            "models": [
              {
                "id": "openrouter/bifrost/main-free",
                "name": "Bifrost main-free",
                "reasoning": true,
                "input": ["text"],
                "cost": {
                  "input": 0,
                  "output": 0,
                  "cacheRead": 0,
                  "cacheWrite": 0
                },
                "contextWindow": 1000000,
                "maxTokens": 32768
              }
            ]
          }
        }

      # ------------------------------------------------------------
      # OpenCode local -> Bifrost
      # ------------------------------------------------------------
      PAPERCLIP_OPENCODE_PROVIDERS: >-
        {
          "bifrost": {
            "npm": "@ai-sdk/openai-compatible",
            "name": "Bifrost",
            "options": {
              "baseURL": "${BIFROST_OPENAI_BASE_URL}",
              "apiKey": "{env:OPENAI_API_KEY}"
            },
            "models": {
              "openrouter/bifrost/main-free": {
                "contextWindow": 1000000,
                "maxTokens": 32768
              }
            }
          }
        }

      PAPERCLIP_OPENCODE_SMALL_MODEL: "bifrost/openrouter/bifrost/main-free"

      OPENCODE_ALLOW_ALL_MODELS: "true"

    volumes:
      - paperclip-data:/paperclip
      - hermes-data:/home/node/.hermes

    networks:
      - dokploy-network

networks:
  default:
    name: dokploy-network
    external: true

  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  paperclip-data:
  paperclip-postgres:
  hermes-data: