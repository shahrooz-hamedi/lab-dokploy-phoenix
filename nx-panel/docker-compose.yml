services:
  panel:
    image: ghcr.io/nx-panel/panel:latest
    restart: unless-stopped
    environment:
      NX_WEB_LISTEN: "0.0.0.0:7090"
    expose:
      - "7090"
    volumes:
      - /var/lib/nx-panel/data:/app/db
      - /var/lib/nx-panel/backups:/app/db/backups
      - /var/lib/nx-panel/rulesets:/app/db/rulesets
      - /var/lib/nx-panel/bin:/app/bin
      - /var/lib/nx-panel/sub-themes:/app/sub-themes:ro
      - /etc/machine-id:/etc/machine-id:ro
      # CertMate-managed wildcard certificate
      - /etc/dokploy/traefik/dynamic/certificates/phoenix-rtp.com:/certs/phoenix-rtp.com:ro
    networks:
      - dokploy-network
networks:
  dokploy-network:
    external: true