services:
  panel:
    image: ghcr.io/nx-panel/panel:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/lib/nx-panel/data:/app/db
      - /var/lib/nx-panel/backups:/app/db/backups
      - /var/lib/nx-panel/rulesets:/app/db/rulesets
      - /var/lib/nx-panel/bin:/app/bin
      - /var/lib/nx-panel/sub-themes:/app/sub-themes:ro
      - /etc/machine-id:/etc/machine-id:ro