name: pub-tunnel

services:
  tunnel:
    build:
      context: .
      dockerfile: Dockerfile

    image: pub-tunnel-ubuntu:24.04

    hostname: pub-tunnel
    restart: unless-stopped
    stop_grace_period: 30s
    init: false
    cgroup: host

    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - NET_RAW

    devices:
      - /dev/net/tun:/dev/net/tun

    security_opt:
      - apparmor:unconfined

    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - xraymesh-config:/etc/xraymesh
      - xraymesh-install:/opt/xraymesh
      - xraymesh-state:/var/lib/xraymesh
      - /etc/dokploy/traefik/dynamic/certificates/phoenix-rtp.com/fullchain.pem:/etc/ctunnel/certs/fullchain.pem:ro
      - /etc/dokploy/traefik/dynamic/certificates/phoenix-rtp.com/privkey.pem:/etc/ctunnel/certs/privkey.pem:ro

    tmpfs:
      - /run
      - /run/lock
      - /tmp

    ports:
      - target: 2083
        published: "2083"
        protocol: tcp
        mode: host

      - target: 2083
        published: "2083"
        protocol: udp
        mode: host

    networks:
      - default
      - xui-ipv6-egress

    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          memory: 512M

volumes:
  xraymesh-config:
  xraymesh-install:
  xraymesh-state:

networks:
  default:
    name: dokploy-network
    external: true

  xui-ipv6-egress:
    external: true