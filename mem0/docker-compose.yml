services:

  mem0:
    build:
      context: .
      dockerfile: Dockerfile.mem0
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      MEM0_DEFAULT_LLM_MODEL: ${MEM0_DEFAULT_LLM_MODEL}
      MEM0_DEFAULT_EMBEDDER_MODEL: ${MEM0_DEFAULT_EMBEDDER_MODEL}
      MEM0_EMBEDDING_MODEL_DIMS: ${MEM0_EMBEDDING_MODEL_DIMS}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_COLLECTION_NAME: memories

      APP_DB_NAME: mem0_app
      JWT_SECRET: ${JWT_SECRET}
      AUTH_DISABLED: "false"
      DASHBOARD_URL: https://memory.phoenix-rtp.com
      MEM0_TELEMETRY: "false"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - dokploy-network

    expose:
      - "8000"

    volumes:
      - mem0_history:/app/history

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s


  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    shm_size: "128mb"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres

    volumes:
      - mem0_postgres:/var/lib/postgresql/data

    networks:
      - dokploy-network

    expose:
      - "5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -q -d postgres -U ${POSTGRES_USER}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  mem0-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    restart: unless-stopped

    environment:
      NEXT_PUBLIC_API_URL: https://mem0.phoenix-rtp.com
      API_INTERNAL_URL: http://mem0:8000
      NEXT_PUBLIC_INSTANCE_NAME: Mem0

    depends_on:
      mem0:
        condition: service_healthy

    networks:
      - dokploy-network

    expose:
      - "3000"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:3000/api/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s


volumes:
  mem0_postgres:
    name: mem0-postgres
  mem0_history:
    name: mem0-history


networks:
  default:
    name: dokploy-network
    external: true
  dokploy-network:
    name: dokploy-network
    external: true