services:
  adguardhome:
    image: adguard/adguardhome:latest
    restart: unless-stopped

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "853:853/tcp"
      - "853:853/udp"

    volumes:
      - adguardhome-work:/opt/adguardhome/work
      - adguardhome-conf:/opt/adguardhome/conf
      - /etc/dokploy/adguard-certs:/etc/adguard-certs:ro

    networks:
      dokploy-network:
        ipv4_address: 10.0.1.20

    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      - traefik.http.routers.adguard-http.rule=Host(`dns.phoenix-rtp.com`) && PathPrefix(`/dns-query`)
      - traefik.http.routers.adguard-http.entrypoints=web
      - traefik.http.routers.adguard-http.middlewares=redirect-to-https

      - traefik.http.routers.adguard-https.rule=Host(`dns.phoenix-rtp.com`) && PathPrefix(`/dns-query`)
      - traefik.http.routers.adguard-https.entrypoints=websecure
      - traefik.http.routers.adguard-https.tls=true
      - traefik.http.routers.adguard-https.service=adguard

      - traefik.http.services.adguard.loadbalancer.server.port=443
      - traefik.http.services.adguard.loadbalancer.server.scheme=https
      - traefik.http.services.adguard.loadbalancer.serverstransport=adguard-tls@file

volumes:
  adguardhome-work:
  adguardhome-conf:

networks:
  default:
    name: dokploy-network
    external: true
  dokploy-network:
    name: dokploy-network
    external: true