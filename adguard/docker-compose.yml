services:

  adguardhome:
    image: adguard/adguardhome:latest
    restart: unless-stopped

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "853:853/tcp"
      - "853:853/udp"

    volumes:
      - adguardhome-work:/opt/adguardhome/work
      - adguardhome-conf:/opt/adguardhome/conf
      - /etc/dokploy/adguard-certs:/etc/adguard-certs:ro

    networks:
      dokploy-network:
        ipv4_address: 10.0.1.20

    labels:
      - traefik.http.routers.lab-adguard-4ynnux-7-web.rule=Host(`adguard.phoenix-rtp.com`)
      - traefik.http.routers.lab-adguard-4ynnux-7-web.entrypoints=web
      - traefik.http.services.lab-adguard-4ynnux-7-web.loadbalancer.server.port=80
      - traefik.http.routers.lab-adguard-4ynnux-7-web.service=lab-adguard-4ynnux-7-web
      - traefik.http.routers.lab-adguard-4ynnux-7-web.middlewares=redirect-to-https@file

      - traefik.http.routers.lab-adguard-4ynnux-7-websecure.rule=Host(`adguard.phoenix-rtp.com`)
      - traefik.http.routers.lab-adguard-4ynnux-7-websecure.entrypoints=websecure
      - traefik.http.services.lab-adguard-4ynnux-7-websecure.loadbalancer.server.port=80
      - traefik.http.routers.lab-adguard-4ynnux-7-websecure.service=lab-adguard-4ynnux-7-websecure
      - traefik.http.routers.lab-adguard-4ynnux-7-websecure.tls=true

      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      - traefik.http.routers.adguard-http.rule=Host(`dns.phoenix-rtp.com`) && PathPrefix(`/dns-query`)
      - traefik.http.routers.adguard-http.entrypoints=web
      - traefik.http.routers.adguard-http.middlewares=redirect-to-https

      - traefik.http.routers.adguard-https.rule=Host(`dns.phoenix-rtp.com`) && PathPrefix(`/dns-query`)
      - traefik.http.routers.adguard-https.entrypoints=websecure
      - traefik.http.routers.adguard-https.tls=true
      - traefik.http.routers.adguard-https.service=adguard

      - traefik.http.services.adguard.loadbalancer.server.port=443
      - traefik.http.services.adguard.loadbalancer.server.scheme=https
      - traefik.http.services.adguard.loadbalancer.serverstransport=adguard-tls@file


volumes:

  adguardhome-work:
    name: lab-adguard-4ynnux_adguardhome-work

  adguardhome-conf:
    name: lab-adguard-4ynnux_adguardhome-conf


networks:

  default:
    name: dokploy-network
    external: true

  dokploy-network:
    name: dokploy-network
    external: true