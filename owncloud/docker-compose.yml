services:

  # ============================================================
  # oCIS CONFIGURATION
  # ============================================================

  ocis-config:
    image: alpine:latest
    restart: "no"

    environment:
      COMPANION_DOMAIN: ${COMPANION_DOMAIN}
      COLLABORA_DOMAIN: ${COLLABORA_DOMAIN}

    command:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /etc/ocis

        cat > /etc/ocis/csp.yaml <<EOF
        directives:
          child-src:
            - '''self'''
          connect-src:
            - '''self'''
            - 'blob:'
            - 'https://${COMPANION_DOMAIN}/'
            - 'wss://${COMPANION_DOMAIN}/'
            - 'https://raw.githubusercontent.com/owncloud/awesome-ocis/'
            - 'https://*.tile.openstreetmap.org'
          default-src:
            - '''none'''
          font-src:
            - '''self'''
            - 'data:'
          frame-ancestors:
            - '''self'''
          frame-src:
            - '''self'''
            - 'blob:'
            - 'https://embed.diagrams.net/'
            - 'https://${COLLABORA_DOMAIN}/'
          img-src:
            - '''self'''
            - 'data:'
            - 'blob:'
            - 'https://raw.githubusercontent.com/owncloud/awesome-ocis/'
            - 'https://${COLLABORA_DOMAIN}/'
            - 'https://*.tile.openstreetmap.org'
          manifest-src:
            - '''self'''
          media-src:
            - '''self'''
          object-src:
            - '''self'''
            - 'blob:'
          script-src:
            - '''self'''
            - '''unsafe-inline'''
          style-src:
            - '''self'''
            - '''unsafe-inline'''
        EOF

        cat > /etc/ocis/apps.yaml <<EOF
        importer:
          config:
            companionUrl: https://${COMPANION_DOMAIN}
            supportedClouds:
              - WebdavPublicLink
              - OneDrive

        external-sites:
          config:
            sites: []
        EOF

        cat > /etc/ocis/banned-password-list.txt <<EOF
        password
        12345678
        123
        ownCloud
        ownCloud-1
        EOF

        echo "oCIS configuration initialized."

    volumes:
      - ocis-config:/etc/ocis

    networks:
      - dokploy-network


  # ============================================================
  # oCIS WEB EXTENSIONS
  # ============================================================

  importer-init:
    image: owncloud/web-extensions:importer-latest
    restart: "no"
    user: root

    entrypoint:
      - /bin/sh

    command:
      - -c
      - cp -R /var/lib/nginx/html/importer/ /apps

    volumes:
      - ocis-apps:/apps

    networks:
      - dokploy-network


  advanced-search-init:
    image: owncloud/web-extensions:advanced-search-latest
    restart: "no"
    user: root

    entrypoint:
      - /bin/sh

    command:
      - -c
      - cp -R /var/lib/nginx/html/advanced-search/ /apps

    volumes:
      - ocis-apps:/apps

    networks:
      - dokploy-network


  drawio-init:
    image: owncloud/web-extensions:draw-io-latest
    restart: "no"
    user: root

    entrypoint:
      - /bin/sh

    command:
      - -c
      - cp -R /var/lib/nginx/html/draw-io/ /apps

    volumes:
      - ocis-apps:/apps

    networks:
      - dokploy-network


  externalsites-init:
    image: owncloud/web-extensions:external-sites-latest
    restart: "no"
    user: root

    entrypoint:
      - /bin/sh

    command:
      - -c
      - cp -R /var/lib/nginx/html/external-sites/ /apps

    volumes:
      - ocis-apps:/apps

    networks:
      - dokploy-network


  jsonviewer-init:
    image: owncloud/web-extensions:json-viewer-latest
    restart: "no"
    user: root

    entrypoint:
      - /bin/sh

    command:
      - -c
      - cp -R /var/lib/nginx/html/json-viewer/ /apps

    volumes:
      - ocis-apps:/apps

    networks:
      - dokploy-network


  photo-addon-init:
    image: owncloud/web-extensions:photo-addon-latest
    restart: "no"
    user: root

    entrypoint:
      - /bin/sh

    command:
      - -c
      - cp -R /var/lib/nginx/html/photo-addon/ /apps

    volumes:
      - ocis-apps:/apps

    networks:
      - dokploy-network


  progressbars-init:
    image: owncloud/web-extensions:progress-bars-latest
    restart: "no"
    user: root

    entrypoint:
      - /bin/sh

    command:
      - -c
      - cp -R /var/lib/nginx/html/progress-bars/ /apps

    volumes:
      - ocis-apps:/apps

    networks:
      - dokploy-network


  unzip-init:
    image: owncloud/web-extensions:unzip-latest
    restart: "no"
    user: root

    entrypoint:
      - /bin/sh

    command:
      - -c
      - cp -R /var/lib/nginx/html/unzip/ /apps

    volumes:
      - ocis-apps:/apps

    networks:
      - dokploy-network


  # ============================================================
  # oCIS
  # ============================================================

  ocis:
    image: owncloud/ocis:latest
    restart: always

    depends_on:
      ocis-config:
        condition: service_completed_successfully
      importer-init:
        condition: service_completed_successfully
      advanced-search-init:
        condition: service_completed_successfully
      drawio-init:
        condition: service_completed_successfully
      externalsites-init:
        condition: service_completed_successfully
      jsonviewer-init:
        condition: service_completed_successfully
      photo-addon-init:
        condition: service_completed_successfully
      progressbars-init:
        condition: service_completed_successfully
      unzip-init:
        condition: service_completed_successfully

    entrypoint:
      - /bin/sh

    command:
      - -c
      - |
        ocis init || true
        exec ocis server

    environment:
      OCIS_ADD_RUN_SERVICES: ${START_ADDITIONAL_SERVICES}

      OCIS_URL: https://${OCIS_DOMAIN}
      OCIS_LOG_LEVEL: info
      OCIS_LOG_PRETTY: "false"

      PROXY_TLS: "false"
      PROXY_ENABLE_BASIC_AUTH: "false"

      OCIS_INSECURE: "false"

      GATEWAY_GRPC_ADDR: 0.0.0.0:9142

      IDM_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      IDM_CREATE_DEMO_USERS: "false"

      OCIS_JWT_SECRET: ${OCIS_JWT_SECRET}
      OCIS_REVA_GATEWAY: ${OCIS_REVA_GATEWAY}

      NOTIFICATIONS_SMTP_HOST: ${SMTP_HOST}
      NOTIFICATIONS_SMTP_PORT: ${SMTP_PORT}
      NOTIFICATIONS_SMTP_SENDER: ${SMTP_SENDER}
      NOTIFICATIONS_SMTP_USERNAME: ${SMTP_USERNAME}
      NOTIFICATIONS_SMTP_INSECURE: ${SMTP_INSECURE}

      MICRO_REGISTRY_ADDRESS: 127.0.0.1:9233
      NATS_NATS_HOST: 0.0.0.0
      NATS_NATS_PORT: 9233

      PROXY_CSP_CONFIG_FILE_LOCATION: /etc/ocis/csp.yaml

      COLLABORA_DOMAIN: ${COLLABORA_DOMAIN}
      COMPANION_DOMAIN: ${COMPANION_DOMAIN}

      OCIS_PASSWORD_POLICY_BANNED_PASSWORDS_LIST: /etc/ocis/banned-password-list.txt

    volumes:
      - ocis-config:/etc/ocis
      - ocis-data:/var/lib/ocis
      - ocis-apps:/apps

    expose:
      - "9200"

    networks:
      - dokploy-network


  # ============================================================
  # TIKA
  # ============================================================

  tika:
    image: apache/tika:latest-full
    restart: always

    expose:
      - "9998"

    networks:
      - dokploy-network


  # ============================================================
  # COLLABORA WOPI PROOF KEY INITIALIZATION
  #
  # Generates a persistent RSA private key used by Collabora
  # for WOPI proof-key signing.
  # ============================================================

  collabora-proof-key-init:
    image: alpine/openssl:3.5.8
    restart: "no"

    entrypoint:
      - /bin/sh

    command:
      - -ec
      - |
        if [ ! -s /proof/proof_key ]; then
          echo "Generating Collabora WOPI proof key..."

          openssl genrsa \
            -traditional \
            -out /proof/proof_key.tmp \
            4096

          chown 1001:1001 /proof/proof_key.tmp
          chmod 600 /proof/proof_key.tmp

          mv /proof/proof_key.tmp /proof/proof_key

          echo "Collabora WOPI proof key generated."
        else
          echo "Collabora WOPI proof key already exists; keeping it."
        fi

    volumes:
      - collabora-proof-key:/proof

    networks:
      - dokploy-network


  # ============================================================
  # oCIS COLLABORATION SERVICE
  # ============================================================

  collaboration:
    image: owncloud/ocis:latest
    restart: always

    depends_on:
      ocis:
        condition: service_started
      collabora:
        condition: service_started

    command:
      - collaboration
      - server

    environment:
      OCIS_URL: https://${OCIS_DOMAIN}
      OCIS_JWT_SECRET: ${OCIS_JWT_SECRET}
      OCIS_REVA_GATEWAY: ${OCIS_REVA_GATEWAY}

      COLLABORATION_GRPC_ADDR: 0.0.0.0:9301
      COLLABORATION_HTTP_ADDR: 0.0.0.0:9300

      MICRO_REGISTRY: nats-js-kv
      MICRO_REGISTRY_ADDRESS: ocis:9233

      COLLABORATION_WOPI_SRC: https://${WOPISERVER_DOMAIN}

      COLLABORATION_APP_NAME: CollaboraOnline
      COLLABORATION_APP_PRODUCT: Collabora
      COLLABORATION_APP_ADDR: https://${COLLABORA_DOMAIN}
      COLLABORATION_APP_ICON: https://${COLLABORA_DOMAIN}/favicon.ico
      COLLABORATION_APP_INSECURE: "false"

      COLLABORATION_WOPI_SECRET: ${COLLABORATION_WOPI_SECRET}

      COLLABORATION_CS3API_DATAGATEWAY_INSECURE: "false"

      COLLABORATION_LOG_LEVEL: info

    volumes:
      - ocis-config:/etc/ocis

    expose:
      - "9300"
      - "9301"

    networks:
      - dokploy-network


  # ============================================================
  # COLLABORA CODE
  # ============================================================

  collabora:
    image: collabora/code:latest
    restart: always

    depends_on:
      collabora-proof-key-init:
        condition: service_completed_successfully

    environment:
      DONT_GEN_SSL_CERT: "YES"

      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.ssl_verification=false
        --o:ssl.termination=true
        --o:welcome.enable=false
        --o:net.frame_ancestors=https://${OCIS_DOMAIN}

      username: ${COLLABORA_ADMIN_USERNAME}
      password: ${COLLABORA_ADMIN_PASSWORD}

    cap_add:
      - MKNOD

    volumes:
      - collabora-proof-key:/etc/coolwsd/proof_key:ro

    expose:
      - "9980"

    networks:
      - dokploy-network


  # ============================================================
  # UPPY COMPANION / ONEDRIVE
  # ============================================================

  companion:
    image: transloadit/companion:5.8.0
    restart: always

    environment:
      NODE_ENV: production

      # Companion must be able to communicate with the HTTPS
      # oCIS endpoint using the internal trusted certificate.
      NODE_TLS_REJECT_UNAUTHORIZED: "0"

      COMPANION_DATADIR: /tmp/companion/
      COMPANION_DOMAIN: ${COMPANION_DOMAIN}
      COMPANION_PROTOCOL: https
      COMPANION_UPLOAD_URLS: "^https://${OCIS_DOMAIN}/"

      COMPANION_ONEDRIVE_KEY: ${COMPANION_ONEDRIVE_KEY}
      COMPANION_ONEDRIVE_SECRET: ${COMPANION_ONEDRIVE_SECRET}

      COMPANION_TUS_DEFERRED_UPLOAD_LENGTH: "false"
      COMPANION_CLIENT_ORIGINS: "https://${OCIS_DOMAIN},https://${COMPANION_DOMAIN}"

    volumes:
      - companion-data:/tmp/companion/

    expose:
      - "3020"

    networks:
      - dokploy-network


# ==============================================================
# VOLUMES
# ==============================================================

volumes:

  ocis-config:
    name: owncloud-ocis-config

  ocis-data:
    name: owncloud-ocis-data

  ocis-apps:
    name: owncloud-ocis-apps

  companion-data:
    name: owncloud-companion-data

  collabora-proof-key:
    name: owncloud-collabora-proof-key


# ==============================================================
# NETWORK
# ==============================================================

networks:

  dokploy-network:
    external: true