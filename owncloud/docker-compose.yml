services:

  # ==============================================================
  # OWNCloud Infinite Scale 8.2.0
  # ==============================================================

  ocis:
    image: ${OCIS_IMAGE}

    entrypoint:
      - /bin/sh
      - -c

    command:
      - "ocis init || true; exec ocis server"

    environment:
      # ----------------------------------------------------------
      # Basic oCIS configuration
      # ----------------------------------------------------------

      OCIS_URL: https://${OCIS_DOMAIN}

      OCIS_LOG_LEVEL: ${OCIS_LOG_LEVEL}
      OCIS_LOG_PRETTY: ${OCIS_LOG_PRETTY}

      OCIS_INSECURE: ${OCIS_INSECURE}

      # ----------------------------------------------------------
      # Authentication / IDM
      # ----------------------------------------------------------

      IDM_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      IDM_CREATE_DEMO_USERS: ${IDM_CREATE_DEMO_USERS}

      OCIS_JWT_SECRET: ${OCIS_JWT_SECRET}

      # ----------------------------------------------------------
      # Proxy / Reva
      # ----------------------------------------------------------

      PROXY_TLS: "false"
      PROXY_ENABLE_BASIC_AUTH: "false"

      GATEWAY_GRPC_ADDR: 0.0.0.0:9142

      OCIS_REVA_GATEWAY: ${OCIS_REVA_GATEWAY}

      # ----------------------------------------------------------
      # Internal NATS / service registry
      # ----------------------------------------------------------

      MICRO_REGISTRY_ADDRESS: 127.0.0.1:9233

      NATS_NATS_HOST: 0.0.0.0
      NATS_NATS_PORT: 9233

      # ----------------------------------------------------------
      # Additional services
      #
      # Keep empty for Stage 1.
      # We will add services deliberately in later stages.
      # ----------------------------------------------------------

      START_ADDITIONAL_SERVICES: ${START_ADDITIONAL_SERVICES}

      # ----------------------------------------------------------
      # SMTP
      #
      # Disabled for Stage 1.
      # ----------------------------------------------------------

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SENDER: ${SMTP_SENDER}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_INSECURE: ${SMTP_INSECURE}

    volumes:
      - owncloud-ocis-config:/etc/ocis
      - owncloud-ocis-data:/var/lib/ocis

    expose:
      - "9200"

    networks:
      - dokploy-network

    restart: unless-stopped


# ==============================================================
# PERSISTENT STORAGE
# ==============================================================

volumes:

  owncloud-ocis-config:
    name: owncloud-ocis-config

  owncloud-ocis-data:
    name: owncloud-ocis-data


# ==============================================================
# DOKPLOY SHARED NETWORK
# ==============================================================

networks:

  default:
    name: dokploy-network
    external: true

  dokploy-network:
    name: dokploy-network
    external: true