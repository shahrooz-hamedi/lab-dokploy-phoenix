services:

  ocis-config:
    image: alpine:latest
    restart: "no"

    environment:
      COMPANION_DOMAIN: ${COMPANION_DOMAIN}
      COLLABORA_DOMAIN: ${COLLABORA_DOMAIN}

    command:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /etc/ocis

        cat > /etc/ocis/csp.yaml <<EOF
        directives:
          child-src:
            - '''self'''
          connect-src:
            - '''self'''
            - 'blob:'
            - 'https://${COMPANION_DOMAIN}/'
            - 'wss://${COMPANION_DOMAIN}/'
            - 'https://raw.githubusercontent.com/owncloud/awesome-ocis/'
            - 'https://*.tile.openstreetmap.org'
          default-src:
            - '''none'''
          font-src:
            - '''self'''
            - 'data:'
          frame-ancestors:
            - '''self'''
          frame-src:
            - '''self'''
            - 'blob:'
            - 'https://embed.diagrams.net/'
            - 'https://${COLLABORA_DOMAIN}/'
          img-src:
            - '''self'''
            - 'data:'
            - 'blob:'
            - 'https://raw.githubusercontent.com/owncloud/awesome-ocis/'
            - 'https://${COLLABORA_DOMAIN}/'
            - 'https://*.tile.openstreetmap.org'
          manifest-src:
            - '''self'''
          media-src:
            - '''self'''
          object-src:
            - '''self'''
            - 'blob:'
          script-src:
            - '''self'''
            - '''unsafe-inline'''
          style-src:
            - '''self'''
            - '''unsafe-inline'''
        EOF

        cat > /etc/ocis/apps.yaml <<EOF
        importer:
          config:
            companionUrl: https://${COMPANION_DOMAIN}
            supportedClouds:
              - WebdavPublicLink
              - OneDrive
        EOF

        cat > /etc/ocis/banned-password-list.txt <<EOF
        password
        12345678
        123
        ownCloud
        ownCloud-1
        EOF

        echo "OCIS configuration initialized."

    volumes:
      - ocis-config:/etc/ocis

    networks:
      - dokploy-network


  importer-init:
    image: owncloud/web-extensions:importer-0.4.0
    restart: "no"
    user: root

    entrypoint:
      - /bin/sh

    command:
      - -c
      - cp -R /var/lib/nginx/html/importer/ /apps

    volumes:
      - ocis-apps:/apps

    networks:
      - dokploy-network


  ocis:
    image: owncloud/ocis:latest
    restart: always

    depends_on:
      ocis-config:
        condition: service_completed_successfully
      importer-init:
        condition: service_completed_successfully

    entrypoint:
      - /bin/sh

    command:
      - -c
      - |
        ocis init || true
        exec ocis server

    environment:
      OCIS_ADD_RUN_SERVICES: ${START_ADDITIONAL_SERVICES}

      OCIS_URL: https://${OCIS_DOMAIN}
      OCIS_LOG_LEVEL: info
      OCIS_LOG_PRETTY: "false"

      PROXY_TLS: "false"
      PROXY_ENABLE_BASIC_AUTH: "false"

      OCIS_INSECURE: "false"

      GATEWAY_GRPC_ADDR: 0.0.0.0:9142

      IDM_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      IDM_CREATE_DEMO_USERS: "false"

      # Shared OCIS authentication configuration
      OCIS_JWT_SECRET: ${OCIS_JWT_SECRET}
      OCIS_REVA_GATEWAY: ${OCIS_REVA_GATEWAY}

      # Notifications
      NOTIFICATIONS_SMTP_HOST: ${SMTP_HOST}
      NOTIFICATIONS_SMTP_PORT: ${SMTP_PORT}
      NOTIFICATIONS_SMTP_SENDER: ${SMTP_SENDER}
      NOTIFICATIONS_SMTP_USERNAME: ${SMTP_USERNAME}
      NOTIFICATIONS_SMTP_INSECURE: ${SMTP_INSECURE}

      # Embedded NATS / registry
      MICRO_REGISTRY_ADDRESS: 127.0.0.1:9233
      NATS_NATS_HOST: 0.0.0.0
      NATS_NATS_PORT: 9233

      # UI configuration
      PROXY_CSP_CONFIG_FILE_LOCATION: /etc/ocis/csp.yaml

      COLLABORA_DOMAIN: ${COLLABORA_DOMAIN}
      COMPANION_DOMAIN: ${COMPANION_DOMAIN}

      OCIS_PASSWORD_POLICY_BANNED_PASSWORDS_LIST: /etc/ocis/banned-password-list.txt

    volumes:
      - ocis-config:/etc/ocis
      - ocis-data:/var/lib/ocis
      - ocis-apps:/apps

    expose:
      - "9200"

    networks:
      - dokploy-network


  tika:
    image: apache/tika:latest-full
    restart: always

    expose:
      - "9998"

    networks:
      - dokploy-network


  collaboration:
    image: owncloud/ocis:latest
    restart: always

    depends_on:
      ocis:
        condition: service_started
      collabora:
        condition: service_started

    command:
      - collaboration
      - server

    environment:
      # Shared OCIS authentication
      OCIS_URL: https://${OCIS_DOMAIN}
      OCIS_JWT_SECRET: ${OCIS_JWT_SECRET}
      OCIS_REVA_GATEWAY: ${OCIS_REVA_GATEWAY}

      # Collaboration service
      COLLABORATION_GRPC_ADDR: 0.0.0.0:9301
      COLLABORATION_HTTP_ADDR: 0.0.0.0:9300

      # NATS service registry
      MICRO_REGISTRY: nats-js-kv
      MICRO_REGISTRY_ADDRESS: ocis:9233

      # External WOPI endpoint
      COLLABORATION_WOPI_SRC: https://${WOPISERVER_DOMAIN}

      # Collabora integration
      COLLABORATION_APP_NAME: CollaboraOnline
      COLLABORATION_APP_PRODUCT: Collabora
      COLLABORATION_APP_ADDR: https://${COLLABORA_DOMAIN}
      COLLABORATION_APP_ICON: https://${COLLABORA_DOMAIN}/favicon.ico
      COLLABORATION_APP_INSECURE: "false"

      # WOPI authentication
      COLLABORATION_WOPI_SECRET: ${COLLABORATION_WOPI_SECRET}

      # CS3 gateway TLS
      COLLABORATION_CS3API_DATAGATEWAY_INSECURE: "false"

      COLLABORATION_LOG_LEVEL: info

    volumes:
      - ocis-config:/etc/ocis

    expose:
      - "9300"
      - "9301"

    networks:
      - dokploy-network


  collabora:
    image: collabora/code:latest
    restart: always

    environment:
      DONT_GEN_SSL_CERT: "YES"

      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.ssl_verification=false
        --o:ssl.termination=true
        --o:welcome.enable=false
        --o:net.frame_ancestors=https://${OCIS_DOMAIN}

      username: ${COLLABORA_ADMIN_USERNAME}
      password: ${COLLABORA_ADMIN_PASSWORD}

    cap_add:
      - MKNOD

    expose:
      - "9980"

    networks:
      - dokploy-network


  companion:
    image: transloadit/companion:5.8.0
    restart: always

    environment:
      NODE_ENV: production
      NODE_TLS_REJECT_UNAUTHORIZED: "0"

      COMPANION_DATADIR: /tmp/companion/
      COMPANION_DOMAIN: ${COMPANION_DOMAIN}
      COMPANION_PROTOCOL: https
      COMPANION_UPLOAD_URLS: "^https://${OCIS_DOMAIN}/"

      COMPANION_ONEDRIVE_KEY: ${COMPANION_ONEDRIVE_KEY}
      COMPANION_ONEDRIVE_SECRET: ${COMPANION_ONEDRIVE_SECRET}

      COMPANION_TUS_DEFERRED_UPLOAD_LENGTH: "false"
      COMPANION_CLIENT_ORIGINS: "https://${OCIS_DOMAIN},https://${COMPANION_DOMAIN}"

    volumes:
      - companion-data:/tmp/companion/

    expose:
      - "3020"

    networks:
      - dokploy-network


volumes:
  ocis-config:
    name: owncloud-ocis-config

  ocis-data:
    name: owncloud-ocis-data

  ocis-apps:
    name: owncloud-ocis-apps

  companion-data:
    name: owncloud-companion-data


networks:
  dokploy-network:
    external: true