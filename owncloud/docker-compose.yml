services:

  # ==============================================================
  # oCIS CONFIGURATION
  # ==============================================================

  ocis-config:
    image: alpine:3.23.4
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/ocis

        cat > /etc/ocis/csp.yaml <<'EOF'
        directives:
          child-src:
            - '''self'''
          connect-src:
            - '''self'''
            - 'blob:'
            - 'https://raw.githubusercontent.com/owncloud/awesome-ocis/'
            - 'https://*.tile.openstreetmap.org'
          default-src:
            - '''none'''
          font-src:
            - '''self'''
            - 'data:'
          frame-ancestors:
            - '''self'''
          frame-src:
            - '''self'''
            - 'blob:'
            - 'https://embed.diagrams.net/'
            - 'https://${COLLABORA_DOMAIN}/'
          img-src:
            - '''self'''
            - 'data:'
            - 'blob:'
            - 'https://raw.githubusercontent.com/owncloud/awesome-ocis/'
            - 'https://${COLLABORA_DOMAIN}/'
            - 'https://*.tile.openstreetmap.org'
          manifest-src:
            - '''self'''
          media-src:
            - '''self'''
          object-src:
            - '''self'''
            - 'blob:'
          script-src:
            - '''self'''
            - '''unsafe-inline'''
          style-src:
            - '''self'''
            - '''unsafe-inline'''
        EOF

        cat > /etc/ocis/app-registry.yaml <<'EOF'
        app_registry:
          mimetypes:
          - mime_type: application/vnd.oasis.opendocument.text
            extension: odt
            name: OpenDocument
            description: OpenDocument text document
            icon: ''
            default_app: Collabora
            allow_creation: true
          - mime_type: application/vnd.oasis.opendocument.spreadsheet
            extension: ods
            name: OpenSpreadsheet
            description: OpenDocument spreadsheet document
            icon: ''
            default_app: Collabora
            allow_creation: true
          - mime_type: application/vnd.oasis.opendocument.presentation
            extension: odp
            name: OpenPresentation
            description: OpenDocument presentation document
            icon: ''
            default_app: Collabora
            allow_creation: true
          - mime_type: application/vnd.openxmlformats-officedocument.wordprocessingml.document
            extension: docx
            name: Microsoft Word
            description: Microsoft Word document
            icon: ''
            default_app: Collabora
            allow_creation: true
          - mime_type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
            extension: xlsx
            name: Microsoft Excel
            description: Microsoft Excel document
            icon: ''
            default_app: Collabora
            allow_creation: true
          - mime_type: application/vnd.openxmlformats-officedocument.presentationml.presentation
            extension: pptx
            name: Microsoft PowerPoint
            description: Microsoft PowerPoint document
            icon: ''
            default_app: Collabora
            allow_creation: true
          - mime_type: application/pdf
            extension: pdf
            name: PDF
            description: PDF document
            icon: ''
            default_app: Collabora
            allow_creation: true
        EOF

        cat > /etc/ocis/banned-password-list.txt <<'EOF'
        password
        12345678
        123
        ownCloud
        ownCloud-1
        EOF

    volumes:
      - owncloud-ocis-config:/etc/ocis
    networks:
      - dokploy-network
    restart: "no"

  # ==============================================================
  # OWNCloud Infinite Scale 8.2.0
  # ==============================================================

  ocis:
    image: ${OCIS_IMAGE}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - "ocis init || true; exec ocis server"
    environment:
      OCIS_URL: https://${OCIS_DOMAIN}
      OCIS_LOG_LEVEL: ${OCIS_LOG_LEVEL}
      OCIS_LOG_PRETTY: ${OCIS_LOG_PRETTY}
      OCIS_INSECURE: ${OCIS_INSECURE}
      OCIS_ADD_RUN_SERVICES: ${START_ADDITIONAL_SERVICES}
      IDM_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      IDM_CREATE_DEMO_USERS: ${IDM_CREATE_DEMO_USERS}
      OCIS_JWT_SECRET: ${OCIS_JWT_SECRET}
      PROXY_TLS: "false"
      PROXY_ENABLE_BASIC_AUTH: "false"
      GATEWAY_GRPC_ADDR: 0.0.0.0:9142
      OCIS_REVA_GATEWAY: ${OCIS_REVA_GATEWAY}
      MICRO_REGISTRY_ADDRESS: 127.0.0.1:9233
      NATS_NATS_HOST: 0.0.0.0
      NATS_NATS_PORT: 9233
      NOTIFICATIONS_SMTP_HOST: ${SMTP_HOST}
      NOTIFICATIONS_SMTP_PORT: ${SMTP_PORT}
      NOTIFICATIONS_SMTP_SENDER: ${SMTP_SENDER}
      NOTIFICATIONS_SMTP_USERNAME: ${SMTP_USERNAME}
      NOTIFICATIONS_SMTP_PASSWORD: ${SMTP_PASSWORD}
      NOTIFICATIONS_SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION}
      NOTIFICATIONS_SMTP_INSECURE: ${SMTP_INSECURE}
      PROXY_CSP_CONFIG_FILE_LOCATION: /etc/ocis/csp.yaml
      COLLABORA_DOMAIN: ${COLLABORA_DOMAIN}
      OCIS_PASSWORD_POLICY_BANNED_PASSWORDS_LIST: banned-password-list.txt
      SEARCH_EXTRACTOR_TYPE: tika
      SEARCH_EXTRACTOR_TIKA_TIKA_URL: http://tika:9998
      FRONTEND_FULL_TEXT_SEARCH_ENABLED: "true"
      FRONTEND_APP_HANDLER_SECURE_VIEW_APP_ADDR: com.owncloud.api.collaboration.CollaboraOnline
      GRAPH_AVAILABLE_ROLES: "b1e2218d-eef8-4d4c-b82d-0f1a1b48f3b5,a8d5fe5e-96e3-418d-825b-534dbdf22b99,fb6c3e19-e378-47e5-b277-9732f9de6e21,58c63c02-1d89-4572-916a-870abc5a1b7d,2d00ce52-1fc2-4dbc-8b95-a73b73395f5a,1c996275-f1c9-4e71-abdf-a42f6495e960,312c0871-5ef7-4b3a-85b6-0e4074c64049,aa97fe03-7980-45ac-9e50-b325749fd7e6"
    volumes:
      - owncloud-ocis-config:/etc/ocis
      - owncloud-ocis-data:/var/lib/ocis
    expose:
      - "9200"
    networks:
      - dokploy-network
    depends_on:
      ocis-config:
        condition: service_completed_successfully
    restart: unless-stopped

  # ==============================================================
  # APACHE TIKA
  # ==============================================================

  tika:
    image: apache/tika:latest-full
    expose:
      - "9998"
    networks:
      - dokploy-network
    restart: unless-stopped

  # ==============================================================
  # COLLABORATION SERVICE
  # ==============================================================

  collaboration:
    image: ${OCIS_IMAGE}
    command:
      - collaboration
      - server
    environment:
      OCIS_JWT_SECRET: ${OCIS_JWT_SECRET}
      OCIS_REVA_GATEWAY: ${OCIS_REVA_GATEWAY}
      COLLABORATION_WOPI_SECRET: ${COLLABORATION_WOPI_SECRET}
      COLLABORATION_GRPC_ADDR: 0.0.0.0:9301
      COLLABORATION_HTTP_ADDR: 0.0.0.0:9300
      MICRO_REGISTRY: nats-js-kv
      MICRO_REGISTRY_ADDRESS: ocis:9233
      COLLABORATION_WOPI_SRC: http://collaboration:9300
      COLLABORATION_APP_NAME: CollaboraOnline
      COLLABORATION_APP_PRODUCT: Collabora
      COLLABORATION_APP_ADDR: https://${COLLABORA_DOMAIN}
      COLLABORATION_APP_ICON: https://${COLLABORA_DOMAIN}/favicon.ico
      COLLABORATION_APP_INSECURE: "${OCIS_INSECURE}"
      COLLABORATION_CS3API_DATAGATEWAY_INSECURE: "${OCIS_INSECURE}"
      COLLABORATION_LOG_LEVEL: ${OCIS_LOG_LEVEL}
      OCIS_URL: https://${OCIS_DOMAIN}
    volumes:
      - owncloud-ocis-config:/etc/ocis
    expose:
      - "9300"
      - "9301"
    networks:
      - dokploy-network
    depends_on:
      ocis:
        condition: service_started
      collabora:
        condition: service_healthy
    restart: unless-stopped

  # ==============================================================
  # COLLABORA ONLINE
  # ==============================================================

  collabora:
    image: ${COLLABORA_IMAGE}
    environment:
      DONT_GEN_SSL_CERT: "YES"
      extra_params: |
        --o:ssl.enable=${COLLABORA_SSL_ENABLE} \
        --o:ssl.ssl_verification=${COLLABORA_SSL_VERIFICATION} \
        --o:ssl.termination=true \
        --o:welcome.enable=false \
        --o:net.frame_ancestors=${OCIS_DOMAIN}
      username: ${COLLABORA_ADMIN_USERNAME}
      password: ${COLLABORA_ADMIN_PASSWORD}
    cap_add:
      - MKNOD
    expose:
      - "9980"
    networks:
      - dokploy-network
    entrypoint:
      - /bin/bash
      - -c
    command:
      - "coolconfig generate-proof-key && /start-collabora-online.sh"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9980 && echo -e 'GET /hosting/discovery HTTP/1.1\\r\\nHost: localhost:9980\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep '200 OK'"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

# ==============================================================
# PERSISTENT STORAGE
# ==============================================================

volumes:
  owncloud-ocis-config:
    name: owncloud-ocis-config
  owncloud-ocis-data:
    name: owncloud-ocis-data

# ==============================================================
# DOKPLOY SHARED NETWORK
# ==============================================================

networks:
  default:
    name: dokploy-network
    external: true
  dokploy-network:
    name: dokploy-network
    external: true