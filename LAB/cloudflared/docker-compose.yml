services:
  cloudflared:
    image: 'cloudflare/cloudflared:latest'
    pull_policy: always

    environment:
      - 'TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?}'

    restart: unless-stopped

    networks:
      - dokploy-network

    command:
      - tunnel
      - --no-autoupdate
      - --protocol
      - http2
      - run

networks:
  dokploy-network:
    external: true